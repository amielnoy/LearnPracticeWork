openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: content
    description: Academy teaching content, served from the content store
  - name: auth
    description: Google credential exchange and signed browser sessions
  - name: ai
    description: Bounded AI-provider configuration and generation
  - name: payments
    description: Server-authorized Stripe catalog, checkout, webhook, and entitlement operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Dependency readiness check
      responses:
        "200":
          description: Required dependencies are configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
  /ai/config:
    get:
      operationId: getAiConfig
      tags: [ai]
      summary: Read public AI-provider availability and quota
      responses:
        "200":
          description: Public provider configuration; never includes a key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiConfig"
  /ai/generate:
    post:
      operationId: generateAiResponse
      tags: [ai]
      summary: Generate one bounded AI response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRequest"
      responses:
        "200":
          description: Generated response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateResponse"
        "400":
          $ref: "#/components/responses/RequestError"
        "413":
          $ref: "#/components/responses/RequestError"
        "429":
          $ref: "#/components/responses/RequestError"
        "502":
          $ref: "#/components/responses/RequestError"
        "503":
          $ref: "#/components/responses/RequestError"
        "504":
          $ref: "#/components/responses/RequestError"
  /stripe/prices:
    get:
      operationId: getCoursePrices
      tags: [payments]
      summary: Read the single server-approved course price
      responses:
        "200":
          description: Sales state and approved Stripe price.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoursePrices"
        "500":
          $ref: "#/components/responses/RequestError"
        "503":
          $ref: "#/components/responses/RequestError"
  /stripe/checkout:
    post:
      operationId: createCourseCheckout
      tags: [payments]
      summary: Create checkout using the server-owned course price
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "200":
          description: Hosted checkout URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "400":
          $ref: "#/components/responses/RequestError"
        "500":
          $ref: "#/components/responses/RequestError"
        "503":
          $ref: "#/components/responses/RequestError"
  /stripe/webhook:
    post:
      operationId: receiveStripeWebhook
      tags: [payments]
      summary: Verify and process a raw Stripe event
      responses:
        "200":
          description: Event received, including irrelevant event types.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResponse"
        "400":
          $ref: "#/components/responses/RequestError"
        "413":
          $ref: "#/components/responses/RequestError"
  /stripe/seed:
    post:
      operationId: seedStripeCatalog
      tags: [payments]
      summary: Admin-only idempotent creation of the course product and price
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Existing or newly created catalog identifiers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeedResponse"
        "401":
          $ref: "#/components/responses/RequestError"
        "404":
          $ref: "#/components/responses/RequestError"
        "429":
          $ref: "#/components/responses/RequestError"
        "500":
          $ref: "#/components/responses/RequestError"
  /entitlements/course:
    get:
      operationId: getCourseEntitlement
      tags: [payments]
      summary: Read entitlement for the verified signed-in user and approved course product
      responses:
        "200":
          description: Current course entitlement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementResponse"
        "401":
          $ref: "#/components/responses/RequestError"
        "500":
          $ref: "#/components/responses/RequestError"
        "503":
          $ref: "#/components/responses/RequestError"
  /content/question-bank:
    get:
      operationId: getQuestionBank
      tags: [content]
      summary: Interview question bank
      description: >
        Stages of interview questions, in reading order. Served from the content
        store so the bank can change without a redeploy.
      parameters:
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          description: The bank
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionBank"
        "503":
          $ref: "#/components/responses/ContentUnavailable"
  /content/coding-challenges:
    get:
      operationId: getCodingChallenges
      tags: [content]
      summary: Coding challenges
      description: Challenge levels, each holding its own challenges in order.
      parameters:
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          description: The challenges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodingChallenges"
        "503":
          $ref: "#/components/responses/ContentUnavailable"
  /content/lecture-series:
    get:
      operationId: getLectureSeries
      tags: [content]
      summary: Lecture series
      description: Tracks, each holding its lectures in order.
      parameters:
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          description: The series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LectureSeries"
        "503":
          $ref: "#/components/responses/ContentUnavailable"
  /auth/google:
    post:
      operationId: signInWithGoogle
      tags: [auth]
      summary: Exchange a Google credential for a server session
      description: >
        Verifies the Google ID token and, on success, sets the signed `ata_session`
        HttpOnly cookie. The raw credential is not returned or persisted by the client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleCredential"
      responses:
        "200":
          description: Signed in; the session cookie accompanies this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/AuthError"
        "401":
          $ref: "#/components/responses/AuthError"
        "429":
          $ref: "#/components/responses/AuthError"
        "503":
          $ref: "#/components/responses/AuthError"
  /auth/config:
    get:
      operationId: getAuthConfig
      tags: [auth]
      summary: Read public browser authentication configuration
      description: >
        Returns the public Google OAuth client ID. Static clients use this at
        runtime so Replit does not need authentication configuration or secrets.
      responses:
        "200":
          description: Public authentication configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Read the current signed browser session
      responses:
        "200":
          description: Current verified public profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/AuthError"
  /auth/logout:
    post:
      operationId: signOut
      tags: [auth]
      summary: Delete the browser session cookie
      responses:
        "200":
          description: Signed out, including when no session existed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Lang:
      name: lang
      in: query
      required: false
      description: >
        Which language to serve. Anything other than the two below is treated as
        `en` rather than refused, because this parameter travels in links.
      schema:
        type: string
        enum: [en, he]
        default: en
  responses:
    RequestError:
      description: The request was refused, unavailable, or failed safely.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AuthError:
      description: Authentication failed, is unavailable, or was rate-limited.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ContentUnavailable:
      description: >
        The content store could not be reached. Deliberately a 503 and not a
        500: the request was fine, the dependency was not, and the message is
        fixed so nothing about the store leaks to an unauthenticated caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ContentError"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ReadinessStatus:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
      required: [status, database]
    AiProviderConfig:
      type: object
      properties:
        available:
          type: boolean
        defaultModel:
          type: string
        anonymousDailyQuota:
          type: integer
      required: [available, defaultModel, anonymousDailyQuota]
    AiConfig:
      type: object
      properties:
        groq:
          $ref: "#/components/schemas/AiProviderConfig"
        gemini:
          $ref: "#/components/schemas/AiProviderConfig"
      required: [groq, gemini]
    AiMessage:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 50000
      required: [role, content]
    GenerateRequest:
      type: object
      additionalProperties: false
      properties:
        model:
          type: string
          maxLength: 100
        system:
          type: string
          maxLength: 12000
        messages:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/AiMessage"
        maxTokens:
          type: integer
          minimum: 1
          maximum: 8192
          default: 2500
        grounded:
          type: boolean
          default: false
      required: [messages]
    GenerateResponse:
      type: object
      properties:
        text:
          type: string
        truncated:
          type: boolean
      required: [text, truncated]
    CheckoutRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        acceptedTerms:
          type: boolean
          const: true
        locale:
          type: string
          enum: [en, he]
          default: en
      required: [acceptedTerms]
    CheckoutResponse:
      type: object
      properties:
        url:
          type: string
          format: uri
      required: [url]
    CoursePrices:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        salesEnabled:
          type: boolean
      required: [data, salesEnabled]
    WebhookResponse:
      type: object
      properties:
        received:
          type: boolean
          const: true
      required: [received]
    SeedResponse:
      type: object
      properties:
        status:
          type: string
          enum: [created, already_exists]
        productId:
          type: string
        priceId:
          type: [string, "null"]
      required: [status, productId, priceId]
    EntitlementResponse:
      type: object
      properties:
        hasAccess:
          type: boolean
        purchasedAt:
          type: [string, "null"]
          format: date-time
      required: [hasAccess, purchasedAt]
    ContentError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        issues:
          type: array
          items:
            type: object
            additionalProperties: true
        requestId:
          type: string
      required: [error]
    GoogleCredential:
      type: object
      additionalProperties: false
      properties:
        credential:
          type: string
          minLength: 1
          maxLength: 10000
      required: [credential]
    AuthConfig:
      type: object
      properties:
        clientId:
          type: string
          description: Public Google OAuth client ID, or an empty string when sign-in is disabled.
      required: [clientId]
    GoogleUser:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        picture:
          type: string
        expiresAt:
          type: integer
          description: Google token expiry as Unix epoch milliseconds.
      required: [name, email, picture, expiresAt]
    AuthSession:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/GoogleUser"
      required: [user]
    LogoutResponse:
      type: object
      properties:
        ok:
          type: boolean
          const: true
      required: [ok]
    QuestionBankItem:
      type: object
      properties:
        q:
          type: string
        hint:
          type: string
        answer:
          type: string
      required: [q, hint, answer]
    QuestionBankStage:
      type: object
      properties:
        icon:
          type: string
        title:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuestionBankItem"
      required: [icon, title, items]
    QuestionBank:
      type: object
      properties:
        stages:
          type: array
          items:
            $ref: "#/components/schemas/QuestionBankStage"
      required: [stages]
    CodingChallenge:
      type: object
      properties:
        title:
          type: string
        prompt:
          type: string
        hint:
          type: string
        code:
          type: string
        complexity:
          type: string
      required: [title, prompt, hint, code, complexity]
    CodingChallengeLevel:
      type: object
      properties:
        label:
          type: string
        blurb:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/CodingChallenge"
      required: [label, blurb, items]
    CodingChallenges:
      type: object
      properties:
        levels:
          type: array
          items:
            $ref: "#/components/schemas/CodingChallengeLevel"
      required: [levels]
    Lecture:
      type: object
      properties:
        num:
          type: integer
        ready:
          type: boolean
        title:
          type: string
        desc:
          type: string
        url:
          type: string
          description: Present only once the lecture is published.
      required: [num, ready, title, desc]
    LectureTrack:
      type: object
      properties:
        title:
          type: string
        lead:
          type: string
        lectures:
          type: array
          items:
            $ref: "#/components/schemas/Lecture"
      required: [title, lead, lectures]
    LectureSeries:
      type: object
      properties:
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/LectureTrack"
      required: [tracks]
