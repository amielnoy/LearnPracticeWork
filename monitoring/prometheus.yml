global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: academy-api
    metrics_path: /metrics
    authorization:
      credentials: local-monitor-token
    static_configs:
      - targets: [api:8080]

  - job_name: academy-server-probes
    static_configs:
      - targets: [python-monitor:9108]

  - job_name: academy-test-history
    honor_labels: true
    static_configs:
      - targets: [pushgateway:9091]
