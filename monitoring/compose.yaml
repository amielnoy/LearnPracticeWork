name: academy-monitoring

services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      METRICS_TOKEN: local-monitor-token
    ports:
      - 127.0.0.1:8080:8080
    restart: unless-stopped

  python-monitor:
    build:
      context: ..
      dockerfile: server/Dockerfile
    command: ["python", "-m", "app.monitor"]
    environment:
      PORT: '9108'
      PROBE_INTERVAL_SECONDS: '30'
      MONITORED_SERVERS: >-
        {"local-scalar":"http://api:8080/api/docs","fly-api":"https://ata-api.fly.dev/api/healthz","replit-root":"https://free-tier-insights--amielpeled.replit.app/","replit-academy":"https://free-tier-insights--amielpeled.replit.app/ai-testing-academy/","github-pages":"https://amielnoy.github.io/LearnPracticeWork/"}
    ports:
      - 127.0.0.1:9108:9108
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway:v1.11.3
    ports:
      - 127.0.0.1:9091:9091
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - 127.0.0.1:9090:9090
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: 'true'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana-data:
  prometheus-data:
