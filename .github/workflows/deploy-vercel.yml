name: Deploy

# ─────────────────────────────────────────────────────────────────────────────
#  preflight ──▶ deploy (build ▶ ship ▶ smoke-check)
#
#  The twelve static apps — the academy at the site root, the portfolio and the
#  ten lecture decks mounted underneath it — built here and handed to Vercel as
#  a finished directory. Vercel builds nothing: `vercel deploy --prebuilt` takes
#  the Build Output API layout this workflow assembles, so what ships is exactly
#  what CI produced and the build stays reproducible from this repository.
#
#  Separate from ci.yml on purpose. Tests gate nothing here, which is the same
#  stance the GitHub Pages jobs took before this replaced them: a site that
#  cannot publish while a test is red is a site that cannot ship a fix for the
#  thing that made it red.
#
#  The API ships in the same deployment. `api/index.py` is the FastAPI
#  application in `server/app` running as one Python function, so `/api/*` is
#  same-origin: the login cookie stays first-party and CORS never applies. It is
#  the one part Vercel does build, because the bundle has to be assembled and
#  its dependencies vendored on Linux — which is what this runner is.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time per ref. Not cancel-in-progress on main: a half-run
# deploy that is killed after `vercel deploy` has been accepted still ships.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.20.0'
  # Not pinned. The Vercel CLI is a deploy client talking to a hosted API that
  # moves independently of this repository, and a pin here ages into a client
  # the platform has stopped accepting. Everything that decides what ships —
  # the apps, the build output layout, the routes — is pinned in the lockfile
  # and in deploy/vercel/config.json.
  VERCEL_CLI: 'vercel@latest'

jobs:
  # Checked before twenty minutes of building, and in its own job so the answer
  # can skip the deploy rather than thread an `if` through every step below.
  #
  # All three are required: the token authenticates, and the two IDs are what
  # `--prebuilt` deploys into without an interactive `vercel link`. Missing one
  # otherwise surfaces at the very end as a message about scope, which is not
  # the message someone needs.
  #
  # On main that is a hard failure — a push to main is meant to ship, and a
  # deployment that silently did not happen is the worst of the three outcomes.
  # On a pull request it is a skip with a note, because a contributor cannot add
  # a secret and a red check they cannot fix teaches them to ignore red checks.
  preflight:
    name: Is Vercel configured?
    runs-on: ubuntu-latest
    # A fork's pull request cannot read these secrets at all, so a preview
    # deployment is not something this workflow can offer there.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    outputs:
      configured: ${{ steps.creds.outputs.configured }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - id: creds
        run: |
          set -euo pipefail
          missing=()
          [ -n "${VERCEL_TOKEN:-}" ]      || missing+=("VERCEL_TOKEN")
          [ -n "${VERCEL_ORG_ID:-}" ]     || missing+=("VERCEL_ORG_ID")
          [ -n "${VERCEL_PROJECT_ID:-}" ] || missing+=("VERCEL_PROJECT_ID")
          if [ ${#missing[@]} -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=false" >> "$GITHUB_OUTPUT"
          {
            echo "## ❌ Vercel is not configured"
            echo ""
            echo "Missing repository secret(s): \`${missing[*]}\`"
            echo ""
            echo "Add them under **Settings → Secrets and variables → Actions**."
            echo "\`VERCEL_ORG_ID\` and \`VERCEL_PROJECT_ID\` are printed by \`vercel link\`"
            echo "into \`.vercel/project.json\`; the token comes from your Vercel account settings."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "::error::Missing Vercel secret(s): ${missing[*]} — main cannot deploy."
            exit 1
          fi
          echo "::warning::Missing Vercel secret(s): ${missing[*]} — skipping the preview deployment."

  deploy:
    name: Build and deploy to Vercel
    needs: preflight
    if: ${{ needs.preflight.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      # On `main` the production alias is the durable answer to "where is this
      # now"; the per-deployment URL stops being production at the next deploy.
      url: ${{ github.ref == 'refs/heads/main' && (vars.VERCEL_SITE_ORIGIN || steps.deploy.outputs.url) || steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      # The academy is the site — it is what the root URL serves — and the
      # portfolio and the ten decks sit underneath it. Vite bakes BASE_PATH into
      # every asset URL and each router reads it back, so these three values are
      # what decide where an app lives.
      - name: Build the portfolio
        env:
          PORT: '5173'
          BASE_PATH: /portfolio/
        run: pnpm --filter @workspace/portfolio run build

      # VITE_GOOGLE_CLIENT_ID is inlined into the bundle at build time, so it
      # has to be present here — a value added to the environment afterwards
      # changes nothing, because the bundle is already written. It is a
      # repository variable, not a secret: an OAuth client ID is public by
      # construction and Google enforces which origins may use it. A client
      # *secret* must never appear here, or in any VITE_ variable.
      #
      # VITE_SITE_ORIGIN moves the twenty lecture links in one go (see
      # lib/lectures.ts). Set the repository variable to the Vercel origin once
      # the domain is settled; unset, the links keep their existing target
      # rather than silently pointing at a preview URL.
      - name: Build the AI Testing Academy (site root)
        env:
          PORT: '5174'
          BASE_PATH: /
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_SITE_ORIGIN: ${{ vars.VERCEL_SITE_ORIGIN }}
        run: pnpm --filter @workspace/ai-testing-academy run build

      # A loop rather than ten near-identical steps: the only thing that varies
      # is the number, and a copied step is where the eleventh deck gets
      # forgotten.
      - name: Build the lecture decks
        run: |
          set -euo pipefail
          for n in $(seq 1 10); do
            echo "::group::lecture $n"
            # PORT is required by every artifact's vite.config.ts even for a
            # build, which never listens; the value only has to parse.
            PORT=$((5174 + n)) BASE_PATH="/ai-testing-lecture-${n}/" \
              pnpm --filter "@workspace/ai-testing-lecture-${n}" run build
            echo "::endgroup::"
          done

      # No 404.html copies here, unlike the Pages build. They existed because
      # Pages has no rewrites and answered every deep link through the nearest
      # 404 document; deploy/vercel/config.json rewrites them at 200, which is
      # the reason this deployment moved. The smoke check below is what holds
      # that claim up.
      - name: Assemble the site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R artifacts/ai-testing-academy/dist/public/. _site/
          mkdir -p _site/portfolio
          cp -R artifacts/portfolio/dist/public/. _site/portfolio/
          for n in $(seq 1 10); do
            mkdir -p "_site/ai-testing-lecture-${n}"
            cp -R "artifacts/ai-testing-lecture-${n}/dist/public/." "_site/ai-testing-lecture-${n}/"
          done
          cp architecture.html _site/architecture.html
          # The Allure report is deliberately NOT copied here — ci.yml publishes
          # it to a separate repository's Pages, so it never lands on the site.

      # The function's dependencies, derived from the lockfile the API is
      # already built from rather than a second list that could disagree with
      # it. Vercel's Python builder reads requirements.txt; uv.lock is the
      # source of truth, and this is the translation.
      - name: Export the API's locked dependencies
        run: |
          set -euo pipefail
          uv export --frozen --no-dev --no-emit-project \
            --directory server -o "$GITHUB_WORKSPACE/requirements.txt"
          echo "Pinned packages: $(grep -c '==' requirements.txt)"

      # Project settings, and the environment variables the function will run
      # with. The target has to match the deployment below: production and
      # preview can hold different values for the same name.
      - name: Pull the Vercel project settings
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            target=production
          else
            target=preview
          fi
          echo "target=$target" >> "$GITHUB_ENV"
          pnpm dlx "$VERCEL_CLI" pull --yes --environment="$target" --token "$VERCEL_TOKEN"

      # The one build Vercel does. It copies the assembled _site into
      # .vercel/output/static (outputDirectory in vercel.json) and compiles
      # api/index.py into a Python function, vendoring the wheels for
      # linux/x86_64 — which is why this has to happen on the runner and not on
      # a developer's machine.
      - name: Build the API function
        run: |
          set -euo pipefail
          args=(build --yes --token "$VERCEL_TOKEN")
          if [ "$target" = "production" ]; then args+=(--prod); fi
          pnpm dlx "$VERCEL_CLI" "${args[@]}"

      # Vercel generates a route table of its own; this is the one that serves
      # the site. It carries the security headers, the cache policy, the SPA
      # rewrites for the portfolio and the ten decks, and the /api/* route onto
      # the function — and it is the table tests/unit/vercelRoutes.spec.ts
      # checks on every branch, before anything ships.
      - name: Install the committed route table
        run: |
          set -euo pipefail
          cp deploy/vercel/config.json .vercel/output/config.json
          echo "Static files: $(find .vercel/output/static -type f | wc -l)"
          echo "Functions: $(find .vercel/output/functions -maxdepth 2 -name '*.func' | wc -l)"

      # `--prod` on main, a preview deployment everywhere else. The URL the CLI
      # prints on stdout is the one this run produced — the smoke check below
      # runs against that exact deployment rather than against whatever the
      # production alias currently points at.
      # `pnpm dlx` rather than a global install: one invocation, no PATH or
      # global-bin setup to get wrong on the runner, and the workspace's own
      # node_modules stays untouched by a tool that is not part of it.
      #
      # The CLI writes progress and the inspect link to stderr and the
      # deployment URL to stdout, but only the last line is guaranteed to be
      # that URL — so it is taken from the tail and checked before use rather
      # than trusted into a smoke check that would then test nothing.
      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          args=(deploy --prebuilt --yes --token "$VERCEL_TOKEN")
          if [ "$target" = "production" ]; then args+=(--prod); fi
          url=$(pnpm dlx "$VERCEL_CLI" "${args[@]}" | tail -n 1)
          case "$url" in
            https://*) ;;
            *) echo "::error::The Vercel CLI did not print a deployment URL. Last line: '$url'"; exit 1 ;;
          esac
          echo "Deployed to $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # What the rewrites are for. A deck route (`/slide5`) and an academy route
      # are files that were never built, and on the old host they came back as
      # 404s carrying the right page. Asserting the status here is the
      # difference between "the rewrite is configured" and "the rewrite works".
      #
      # The asset check is the other half: a filesystem hit must not be
      # swallowed by the SPA catch-all, and it must carry the immutable cache
      # header. It reads a real hashed filename out of the built shell rather
      # than guessing one.
      - name: Smoke-check the deployment
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          fail=0

          # `vercel deploy` prints the URL as soon as the deployment is created,
          # which is before the edge is necessarily serving it — the first
          # request can answer 404 against a deployment that is seconds from
          # being live. That is exactly what reddened run 32950109049: the URL
          # was printed at 08:55:32.801 and the check failed at 08:55:33.095,
          # 294ms later, on a deployment that answers 302 to this day.
          #
          # So wait for the root to stop 404-ing before asserting anything. A
          # public production deployment (200) and a protected preview (302 to
          # the SSO endpoint) are both "ready"; only 404 — or a connection
          # failure, which curl reports as 000 — means the edge has not caught
          # up yet.
          wait_for_deployment() {
            local attempts=30 delay=2 attempt code=000
            for attempt in $(seq 1 "$attempts"); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${URL}/" || true)
              case "${code:-000}" in
                404|000) sleep "$delay" ;;
                *) echo "Deployment reachable after ${attempt} attempt(s) (/ → $code)."; return 0 ;;
              esac
            done
            # 000 is curl's "no response at all", which is a different failure
            # from a deployment that exists and answers 404 — say which.
            case "${code:-000}" in
              000) echo "::error::${URL}/ never responded in $((attempts * delay))s — host unreachable." ;;
              *)   echo "::error::${URL}/ still returns $code after $((attempts * delay))s — the deployment never became reachable." ;;
            esac
            return 1
          }
          wait_for_deployment

          # Preview deployments are protected (ssoProtection: preview), so every
          # path answers with Vercel's login redirect and none of the route
          # assertions below can run. Assert what is true there instead: the
          # deployment exists and is protected. Production is public and gets
          # the full pass.
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            # One request, both facts. Two separate curls can land on different
            # states and disagree about what this deployment did.
            headers=$(curl -sSI --max-time 30 "${URL}/" | tr -d '\r')
            code=$(printf '%s\n' "$headers" \
              | awk 'toupper($1) ~ /^HTTP/ { print $2; exit }')
            location=$(printf '%s\n' "$headers" \
              | awk -F': ' 'tolower($1)=="location"{print $2}')
            case "$code:$location" in
              30?:https://vercel.com/sso-api*)
                echo "✅ preview deployed and protected by Vercel Authentication"
                exit 0 ;;
              # Deployment Protection does not always answer with the redirect.
              # A non-browser client — which `curl -I` is — gets a bare 401
              # challenge in several configurations, and that is the protection
              # working, not a broken deployment.
              401:*)
                echo "✅ preview deployed and protected (401 challenge)"
                exit 0 ;;
              200:*)
                echo "::warning::This preview is public — expected Vercel Authentication."
                ;;
              *)
                echo "::error::Preview returned $code (location: ${location:-none})."
                exit 1 ;;
            esac
          fi

          check() { # path, expected status, what it proves
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "${URL}$1")
            if [ "$code" = "$2" ]; then
              echo "✅ $1 → $code ($3)"
            else
              echo "::error::$1 returned $code, expected $2 ($3)"
              fail=1
            fi
          }
          check "/" 200 "academy shell"
          check "/architecture.html" 200 "architecture page"
          check "/portfolio/" 200 "portfolio shell"
          check "/ai-testing-lecture-3/slide5" 200 "deck deep link, rewritten not 404-ed"
          check "/nope-not-a-page" 200 "academy client route"

          asset=$(grep -o '/assets/[A-Za-z0-9._-]*\.js' _site/index.html | head -1)
          if [ -z "$asset" ]; then
            echo "::error::No hashed asset found in the built academy shell."
            fail=1
          else
            cache=$(curl -sSI --max-time 30 "${URL}${asset}" | tr -d '\r' \
              | awk -F': ' 'tolower($1)=="cache-control"{print $2}')
            case "$cache" in
              *immutable*) echo "✅ ${asset} → ${cache}" ;;
              *) echo "::error::${asset} cache-control is '${cache}', expected immutable."; fail=1 ;;
            esac
          fi

          # The API runs in this deployment now, so the smoke check asks it
          # rather than inferring from a content type. /api/healthz touches
          # nothing — no database, no key — so a non-200 here means the function
          # did not boot: a missing module in the bundle, or an import that
          # threw. That is the failure mode this migration can actually produce.
          health=$(curl -sS --max-time 30 "${URL}/api/healthz" || true)
          case "$health" in
            *'"status":"ok"'*) echo "✅ /api/healthz → $health (the function booted)" ;;
            *) echo "::error::/api/healthz answered '${health:-nothing}' — the API function is not serving."
               fail=1 ;;
          esac

          # Readiness names what is degraded instead of hiding it behind a 200.
          # It is reported rather than asserted: Redis and the quota salt are
          # configuration that lives in the Vercel project, and a deployment
          # that ships correctly can still be pointed at a store that is down.
          # `database: not_configured` is the intended state here — progress
          # lives in a spreadsheet and quotas in Redis — so only a *configured*
          # database that cannot be reached turns this into a 503.
          ready=$(curl -sS --max-time 30 "${URL}/api/readyz" || true)
          echo "ℹ️  /api/readyz → ${ready:-no response}"
          case "$ready" in
            *rateLimiting*) echo "::warning::Quotas cannot count — every rate-limited route will refuse callers. Set REDIS_URL and RATE_LIMIT_SALT." ;;
          esac

          # The failure this is here for is silent: an API path answered by the
          # HTML shell at 200 makes the client conclude there is no server.
          api_type=$(curl -sSI --max-time 30 "${URL}/api/ai/config" | tr -d '\r' \
            | awk -F': ' 'tolower($1)=="content-type"{print $2}')
          case "$api_type" in
            *text/html*)
              echo "::error::/api/ai/config is served as HTML — the SPA catch-all is answering it."
              fail=1 ;;
            *) echo "✅ /api/ai/config → ${api_type:-no content-type} (not the SPA shell)" ;;
          esac

          csp=$(curl -sSI --max-time 30 "${URL}/" | tr -d '\r' \
            | awk -F': ' 'tolower($1)=="content-security-policy"{print $2}')
          if [ -n "$csp" ]; then
            echo "✅ / carries a Content-Security-Policy"
          else
            echo "::error::/ has no Content-Security-Policy header."
            fail=1
          fi

          exit "$fail"

      - name: Link the deployment in the run summary
        if: ${{ !cancelled() && steps.deploy.outputs.url != '' }}
        env:
          URL: ${{ steps.deploy.outputs.url }}
          SITE_ORIGIN: ${{ vars.VERCEL_SITE_ORIGIN }}
        run: |
          set -uo pipefail

          # Two URLs answer "where is this": the production alias someone chose,
          # and the hostname Vercel minted for this one deployment. Only the
          # first is still production tomorrow, so on `main` the links point at
          # it and the deployment URL is kept for checking this build alone. A
          # preview has no alias, so there it is the only URL there is.
          base="$URL"
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ -n "$SITE_ORIGIN" ]; then
            base="${SITE_ORIGIN%/}"
          fi

          {
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "## 🚀 Deployed to production"
              echo ""
              if [ -n "$SITE_ORIGIN" ]; then
                echo "**🌐 [${base}](${base})**"
                echo ""
                echo "<sub>This build on its own hostname: [${URL}](${URL}) — pinned to this deployment.</sub>"
              else
                echo "**➡️ [${URL}](${URL})**"
                echo ""
                echo "<sub>That hostname is pinned to this deployment. Set the repository variable \`VERCEL_SITE_ORIGIN\` to the production alias to link it here instead.</sub>"
              fi
            else
              echo "## 🔍 Preview deployment"
              echo ""
              echo "**➡️ [${URL}](${URL})**"
            fi
            echo ""
            echo "| App | URL |"
            echo "| --- | --- |"
            echo "| Academy | [${base}/](${base}/) |"
            echo "| Portfolio | [${base}/portfolio/](${base}/portfolio/) |"
            echo "| Lecture 1 | [${base}/ai-testing-lecture-1/](${base}/ai-testing-lecture-1/) |"
            echo "| Architecture | [${base}/architecture.html](${base}/architecture.html) |"
          } >> "$GITHUB_STEP_SUMMARY"
