name: CI

# Runs on every push and pull request, plus a nightly check at 05:00 Israel
# time. GitHub cron only understands UTC and Israel switches between UTC+2 and
# UTC+3, so both candidate hours are scheduled and the `gate` job drops the one
# that is not actually 05:00 in Asia/Jerusalem.
on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '0 2 * * *' # 05:00 IDT (UTC+3, summer)
    - cron: '0 3 * * *' # 05:00 IST (UTC+2, winter)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.20.0'

jobs:
  gate:
    name: Should this run?
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(TZ=Asia/Jerusalem date +%H)
          echo "Asia/Jerusalem hour is $hour"
          if [ "$hour" = "05" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not 05:00 in Israel — this is the off-season cron, skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

  test:
    name: Tests
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve the Playwright version
        id: playwright
        run: |
          version=$(pnpm --filter @workspace/tests exec playwright --version | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the browser download
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: pnpm --filter @workspace/tests exec playwright install --with-deps chromium

      # api-server and scripts do not compile today, for reasons that predate
      # this pipeline: noImplicitReturns in the Express handlers, `unknown`
      # response bodies from the Gemini and Replit connector fetches, and a
      # MigrationConfig mismatch in stripe-replit-sync. Everything else is
      # clean, so the gate covers everything else. Drop the exclusions — or
      # switch back to plain `pnpm run typecheck` — once those two compile.
      - name: Typecheck
        run: |
          pnpm run typecheck:libs
          pnpm -r --if-present \
            --filter "./artifacts/**" \
            --filter "!@workspace/api-server" \
            --filter "./tests" \
            run typecheck

      # Split per layer so a failure names the layer that broke, and
      # `!cancelled()` lets every later layer still run — including after the
      # typecheck fails, which otherwise silently drops a whole layer out of the
      # Allure report.
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: pnpm run test:unit

      - name: Component tests
        if: ${{ !cancelled() }}
        run: pnpm run test:component

      - name: API tests
        if: ${{ !cancelled() }}
        run: pnpm run test:api

      - name: Contract tests
        if: ${{ !cancelled() }}
        run: pnpm run test:contract

      # Drives the real academy app in desktop + mobile Chrome; Playwright boots
      # the app's own Vite server via the e2e config's `webServer`.
      - name: E2E tests
        if: ${{ !cancelled() }}
        run: pnpm run test:e2e

      # Every suite above wrote into the shared repo-root `allure-results`, so a
      # single generate covers the whole run.
      #
      # Two formats, because the two delivery channels want different things.
      # The multi-file report is what gets published: it is an ordinary static
      # site of many small files, which is what a web server serves well. The
      # single-file build inlines the whole report into one `index.html` so it
      # can be downloaded and opened without a server — convenient to hand
      # someone, and hopeless to publish.
      #
      # They were the same thing until that single file passed roughly 6 MB and
      # GitHub's Pages build began failing on it outright: three runs in a row
      # errored, the last success having been at 5.8 MB. Test output only grows,
      # so the published copy is the one that must not be a single huge file.
      - name: Generate the Allure report (published, multi-file)
        if: ${{ !cancelled() }}
        run: pnpm run report:allure

      - name: Generate the Allure report (downloadable, single file)
        if: ${{ !cancelled() }}
        run: pnpm run report:allure:single

      # The published copy, consumed by the `publish-allure` job below.
      - name: Upload the Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 14
          if-no-files-found: warn

      # The open-it-locally copy. Download, unzip, open `index.html` — no server.
      - name: Upload the single-file Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-single-file
          path: allure-report-single
          retention-days: 14
          if-no-files-found: warn

      - name: Upload the Playwright report
        id: pw-report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/playwright-report
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

      # Link the Playwright HTML report from the run summary. It ships as a
      # downloadable artifact (GitHub does not host artifact HTML), so the link
      # goes to the artifact; unzip and open index.html, or `npx playwright
      # show-report <dir>`.
      - name: Link the Playwright HTML report in the run summary
        if: ${{ !cancelled() && steps.pw-report.outputs.artifact-url != '' }}
        run: |
          {
            echo "## 🎭 Playwright HTML report"
            echo ""
            echo "**➡️ [Download the playwright-report artifact](${{ steps.pw-report.outputs.artifact-url }})**"
            echo ""
            echo "_Unzip and open \`index.html\` (or \`npx playwright show-report <dir>\`)._"
          } >> "$GITHUB_STEP_SUMMARY"

      # Raw Allure results from all four layers land in one directory; the HTML
      # report is generated from them with `pnpm run report:allure`.
      - name: Upload the Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 7
          if-no-files-found: ignore

  build-pages:
    name: Build the site
    # Publish even when the test job failed — `!cancelled()` overrides the
    # skip-on-failed-dependency default, while `gate` still governs whether the
    # run happens at all and the ref/event conditions keep this to a main push.
    needs: [gate, test]
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    # `pages: write` is what lets the configure step below turn Pages on; the
    # deploy job needs its own copy of these for the deployment itself.
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turns Pages on if it is not already. Without this the whole pipeline
      # runs green and only the final deploy fails, with a 404 from the Pages
      # API — the symptom that "Ensure GitHub Pages has been enabled" describes.
      # `enablement: true` needs `pages: write`, granted on this job above.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # `configure-pages` enables Pages when it is missing, but it will not
      # convert a site that is already enabled. A repo left on "Deploy from a
      # branch" therefore keeps that setting, and GitHub's own
      # pages-build-deployment publishes the branch root instead of `_site` —
      # while every job here, deploy-pages included, still reports success.
      #
      # That is not hypothetical. It is how this site spent its time serving its
      # own source tree (`/package.json` 200, `/` 404) across green runs. Failing
      # loudly is the whole point: a deployment nobody serves is worse than one
      # that does not run.
      - name: Require Pages to build from this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read_type() { gh api "repos/${{ github.repository }}/pages" --jq .build_type; }
          current=$(read_type)
          if [ "$current" != "workflow" ]; then
            echo "Pages build_type is '$current' — setting it to 'workflow'."
            gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow
            current=$(read_type)
          fi
          if [ "$current" != "workflow" ]; then
            echo "::error::Pages build_type is '$current', not 'workflow'. The artifact uploaded below would never be served. Set Settings → Pages → Source to 'GitHub Actions'."
            exit 1
          fi
          echo "Pages build_type is 'workflow'."

      # Pages serves a project site from /<repo>/, so every artifact's Vite
      # `base` has to carry that prefix or the hashed asset URLs 404. Prefer the
      # path Pages itself reports — a custom domain or a user/org site is served
      # from the root, where a hardcoded /<repo> would break every asset URL.
      # Falls back to the repo name so a rename cannot silently break links.
      - name: Work out the base path
        id: base
        run: |
          set -euo pipefail
          reported='${{ steps.pages.outputs.base_path }}'
          if [ -z "$reported" ]; then
            # Pages reported nothing — assume the usual project-site layout.
            prefix="/${{ github.event.repository.name }}"
          else
            # "/" (root site) becomes "", "/repo" stays "/repo". Test the raw
            # value before stripping, or a root site looks like an empty one.
            prefix="${reported%/}"
          fi
          echo "Pages reported '${reported}'; using base '${prefix}/'"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"

      - name: Build the portfolio (site root)
        env:
          PORT: '5173'
          BASE_PATH: ${{ steps.base.outputs.prefix }}/
        run: pnpm --filter @workspace/portfolio run build

      - name: Build the AI Testing Academy
        env:
          PORT: '5174'
          BASE_PATH: ${{ steps.base.outputs.prefix }}/ai-testing-academy/
        run: pnpm --filter @workspace/ai-testing-academy run build

      - name: Build lecture 1
        env:
          PORT: '5175'
          BASE_PATH: ${{ steps.base.outputs.prefix }}/ai-testing-lecture-1/
        run: pnpm --filter @workspace/ai-testing-lecture-1 run build

      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R artifacts/portfolio/dist/public/. _site/
          mkdir -p _site/ai-testing-academy _site/ai-testing-lecture-1
          cp -R artifacts/ai-testing-academy/dist/public/. _site/ai-testing-academy/
          cp -R artifacts/ai-testing-lecture-1/dist/public/. _site/ai-testing-lecture-1/
          cp architecture.html _site/architecture.html
          # The Allure report is deliberately NOT copied here — it is published to
          # a separate repository's Pages by the `publish-allure` job, so it never
          # lands on the portfolio site.
          # Client-side routing: Pages has no rewrite rules, so an unknown path
          # has to fall back to the portfolio shell the way Replit's rewrite does.
          cp _site/index.html _site/404.html
          # Stops Pages from running the output through Jekyll, which would drop
          # any file or directory beginning with an underscore.
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    name: Publish to GitHub Pages
    needs: build-pages
    # Explicit rather than relying on the default "run if every dependency
    # succeeded": `build-pages` itself runs through a failed `test` job, and the
    # only thing that should stop the deployment is `build-pages` not producing
    # an artifact. The whole point is that the Allure report is published when
    # tests fail — that is when someone actually needs to read it.
    # (Index syntax, not `needs.build-pages.result`: the expression parser reads
    # the hyphen as subtraction.)
    if: ${{ !cancelled() && needs['build-pages'].result == 'success' }}
    runs-on: ubuntu-latest
    # GitHub's Pages backend has recently taken slightly longer than the
    # deploy action's 10-minute default even though the artifact was accepted.
    # Keep the wait bounded, but leave enough room for a slow Pages publish.
    timeout-minutes: 25
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: '1200000'

  publish-allure:
    name: Publish the Allure report
    # Publishes the report to a SEPARATE repository's gh-pages branch, so the
    # test results get their own Pages URL and never touch the portfolio site.
    # Runs on a main push even when the test job failed — a red run is exactly
    # when someone needs to read the report.
    #
    # Requires two one-time setup items in this repo's settings:
    #   • Secret ALLURE_PAGES_TOKEN — a token (classic PAT with `repo`, or a
    #     fine-grained token with Contents: write on the target repo) that can
    #     push to the reports repository.
    #   • The target repo itself, with Pages set to "Deploy from a branch" on
    #     `main` / (root) — which is where this job force-pushes the report.
    #     Defaults to <owner>/allure-report-learn-practice-deploy; override with
    #     the repository variable ALLURE_PAGES_REPO if you rename it.
    needs: [gate, test]
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    # Lift the secret to a job env so a step `if` can test whether it is set —
    # secrets cannot be referenced in `if` directly, env can.
    env:
      ALLURE_PAGES_TOKEN: ${{ secrets.ALLURE_PAGES_TOKEN }}
    steps:
      - name: Download the Allure report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-report
          path: allure-report

      # Diagnostic: always report whether the workflow can see the secret, never
      # its value (only the character count), so the run summary makes it obvious
      # when the secret is missing or pasted empty.
      - name: Report ALLURE_PAGES_TOKEN status
        run: |
          if [ -n "$ALLURE_PAGES_TOKEN" ]; then
            echo "✅ ALLURE_PAGES_TOKEN is **set** (${#ALLURE_PAGES_TOKEN} chars) — the Allure publish will run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ ALLURE_PAGES_TOKEN is **empty / not set** — the Allure publish is skipped. Add it under Settings → Secrets and variables → Actions → Repository secrets in this repo." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Publish only when the token exists and the test job actually produced a
      # report, so a missing secret or a run that died early skips cleanly
      # instead of failing red.
      - name: Publish to the reports repo (gh-pages)
        if: ${{ env.ALLURE_PAGES_TOKEN != '' && hashFiles('allure-report/index.html') != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ env.ALLURE_PAGES_TOKEN }}
          external_repository: ${{ vars.ALLURE_PAGES_REPO || format('{0}/allure-report-learn-practice-deploy', github.repository_owner) }}
          publish_branch: main
          publish_dir: ./allure-report
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Allure report from ${{ github.repository }}@${{ github.sha }}'

      # Put the report's OWN Pages URL in the run summary, so the correct link is
      # one click away here — the portfolio's Pages URL shown on the "Publish to
      # GitHub Pages" job is a different site and is easy to click by mistake.
      - name: Link the published report in the run summary
        if: ${{ env.ALLURE_PAGES_TOKEN != '' && hashFiles('allure-report/index.html') != '' }}
        env:
          REPORT_REPO: ${{ vars.ALLURE_PAGES_REPO || format('{0}/allure-report-learn-practice-deploy', github.repository_owner) }}
        run: |
          owner="${REPORT_REPO%%/*}"
          name="${REPORT_REPO##*/}"
          url="https://${owner}.github.io/${name}/"
          {
            echo "## 📊 Allure test report"
            echo ""
            echo "**➡️ [${url}](${url})**"
            echo ""
            echo "_Published to the \`${REPORT_REPO}\` repo — a separate site from the portfolio._"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Allure report URL: $url"
