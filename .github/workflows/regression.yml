name: Regression

# ─────────────────────────────────────────────────────────────────────────────
#  The wide pass. CI runs the fast one — Chromium desktop and phone — on every
#  push, because a push should not wait on five engines. This runs the same
#  specs on all of them, every day at 23:59 Israel time, and on demand.
#
#  What "all of them" honestly means:
#    · WebKit desktop and WebKit at an iPhone viewport. WebKit is the engine
#      Safari and every browser on iOS run, so a failure here is a real Safari
#      failure. It is not iOS: a phone viewport and a user agent are not a
#      device, and real iOS needs a Mac runner or a device cloud.
#    · Chromium at a Pixel viewport, which is Android's engine on Android's
#      screen size, and the same caveat applies to the word "Android".
#    · Firefox desktop, which shares no engine with either and is where layout
#      assumptions tend to surface first.
#
#  Locally the same thing is `pnpm run test:regression`.
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    # 23:59 Israel, every day. GitHub cron is UTC only and Israel moves between
    # UTC+2 and UTC+3, so both candidate times are scheduled and the gate below
    # keeps whichever one is 23:59 locally today.
    - cron: '59 20 * * *' # 23:59 IDT (UTC+3, summer)
    - cron: '59 21 * * *' # 23:59 IST (UTC+2, winter)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.20.0'

jobs:
  # The nightly schedule fires twice so that one of them is 05:00 in Israel
  # whichever side of the DST change we are on. This drops the other, exactly as
  # the gate in ci.yml does.
  gate:
    name: Should this run?
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      # Which of the two firings is the real one is decided by today's UTC
      # offset, matched against the cron that actually fired — not by reading
      # the clock and hoping it says 23.
      #
      # Reading the clock is what ci.yml does, and at 05:00 it is fine. At 23:59
      # it is not: GitHub routinely starts a scheduled run minutes late, and one
      # late minute here rolls the local hour to 00, so the correct firing would
      # discard itself and the run would silently never happen. Matching the
      # cron string has no such window — it is exact whenever the job starts.
      - id: check
        env:
          FIRED: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Started by ${{ github.event_name }} — running."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          offset=$(TZ=Asia/Jerusalem date +%z)
          case "$offset" in
            +0300) wanted='59 20 * * *' ;;  # summer, UTC+3
            +0200) wanted='59 21 * * *' ;;  # winter, UTC+2
            *) echo "Unexpected Israel offset $offset — running rather than skipping." >&2
               echo "run=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac

          if [ "$FIRED" = "$wanted" ]; then
            echo "Offset $offset, fired by '$FIRED' — this is the 23:59 run."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Offset $offset wants '$wanted'; this run was '$FIRED' — skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: ${{ matrix.project }}
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One engine per job so a WebKit-only failure is named as such in the
      # checks list, and so a red engine does not stop the others reporting.
      fail-fast: false
      matrix:
        project:
          - e2e-desktop
          - e2e-mobile
          - e2e-desktop-webkit
          - e2e-mobile-webkit
          - e2e-desktop-firefox
          - deck
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Resolve the Playwright version
        id: playwright
        run: |
          version=$(pnpm --filter @workspace/tests exec playwright --version | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Keyed on all three engines, so this cache never collides with the
      # Chromium-only one ci.yml restores.
      - name: Restore the browser download
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-all-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install browsers
        run: pnpm --filter @workspace/tests exec playwright install --with-deps chromium webkit firefox

      - name: Run ${{ matrix.project }}
        run: |
          pnpm --filter @workspace/tests exec playwright test \
            --config=playwright-e2e.config.ts --project=${{ matrix.project }}

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.project }}
          path: |
            tests/playwright-report
            tests/test-results
          retention-days: 7
          if-no-files-found: ignore
