kind = "slides"
previewPath = "/ai-testing-lecture-5/"
title = "API Testing with AI Features — Lecture 5"
description = "Fifth lecture in the AI Testing Academy series: testing AI-powered APIs with pytest and Requests — mocking LLM responses, testing edge cases, and validating structured outputs. Bilingual EN/HE, 30 slides, matches the established AI Testing Academy visual style."
version = "1.0.0"
id = "artifacts/ai-testing-lecture-5"
